<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>RustPing</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #1b2735;
    color: #fff;
    text-align: center;
    padding-top: 50px;
  }
  #ping {
    font-size: 2rem;
    margin: 20px;
  }
  #alert {
    color: #ff4d4d;
    font-weight: bold;
    display: none;
  }
</style>
</head>
<body>
  <h1>RustPing</h1>
  <div id="ping">Ping ölçülüyor...</div>
  <div id="alert">⚠ Ping 100 ms üzerine çıktı!</div>

<script>
const params = new URLSearchParams(window.location.search);
const ipport = params.get('ip') || "185.248.134.13:28010";
const ip = ipport.split(":")[0]; // sadece IP alıyoruz

const pingDiv = document.getElementById("ping");
const alertDiv = document.getElementById("alert");

async function measurePing() {
  const start = performance.now();
  try {
    // Küçük bir fetch isteği atıyoruz
    await fetch(`http://${ip}`, {mode: "no-cors"});
    const end = performance.now();
    const ping = Math.round(end - start);

    pingDiv.textContent = `Ping: ${ping} ms`;

    if (ping > 100) {
      alertDiv.style.display = "block";
    } else {
      alertDiv.style.display = "none";
    }
  } catch (e) {
    pingDiv.textContent = "Sunucuya ulaşılamıyor ❌";
    alertDiv.style.display = "block";
  }
}

// Her saniye ölçüm yap
setInterval(measurePing, 1000);
</script>
</body>
</html>
