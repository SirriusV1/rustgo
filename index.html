<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RustGo - Sunucuya Bağlan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

  body {
    margin: 0;
    padding: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #1b2735, #090a0f);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
  }

  .container {
    background: rgba(255, 255, 255, 0.05);
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    max-width: 400px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 20px;
  }

  p {
    font-size: 1rem;
    margin-bottom: 25px;
    color: #ccc;
  }

  a.btn {
    display: inline-block;
    padding: 12px 25px;
    font-weight: 700;
    text-decoration: none;
    color: #fff;
    background: #e63946;
    border-radius: 10px;
    transition: all 0.3s ease;
  }

  a.btn:hover {
    background: #f06567;
    transform: translateY(-2px);
  }

  .example {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 8px;
    font-family: monospace;
    word-break: break-all;
    margin-top: 15px;
    color: #ffeded;
  }
</style>
</head>
<body>

<div class="container">
  <h1>RustGo</h1>
  <p>Sunucu IP:Port parametresi eksik! <br>
     Sunucuya bağlanmak için aşağıdaki örnek link formatını kullanın:</p>
  <div class="example">
    https://sirriusv1.github.io/rustgo/?ip=185.248.134.30:28010
  </div>
  <p>IP:Port kısmını kendi sunucunuzun adresi ile değiştirin.</p>
</div>

<script>
  // URL parametresinden IP:PORT al
  const params = new URLSearchParams(window.location.search);
  const ipport = params.get('ip');

  if (ipport) {
      // Eğer parametre varsa eski yönlendirme kodunu kullan
      const steamURL = `steam://rungameid/252490//+connect ${ipport}`;
      window.location.href = steamURL;
  }
</script>

</body>
</html>
